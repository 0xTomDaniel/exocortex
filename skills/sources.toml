manifest_version = 1
default_install_root = "/opt/data/skills"

[policy]
source_of_truth = "Flat project .agents/skills/<skill-name>/ directories plus this manifest are the durable source of truth. Runtime-created or runtime-edited skills must be promoted back to git by adding or updating a pinned manifest entry in a PR before they are treated as approved distribution material."
collision_behavior = "Fail closed when two selected entries target the same skill name or destination, or when an existing runtime skill lacks Exo source metadata."
sync_behavior = "Install missing skills, keep matching pinned refs unchanged, and replace an installed skill only when the selected manifest entry keeps the same source id with a different pinned ref."
production_boundary = "Install approved skills into each instance's /opt/data/skills. Keep the repo source tree flat under .agents/skills for Agent Skills compatibility; do not use writable repo-owned skills.external_dirs as the production source of truth."

